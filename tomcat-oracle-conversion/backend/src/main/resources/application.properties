# ===================================================================
# SPRING BOOT APPLICATION CONFIGURATION
# Ticket Tracker - Oracle Backend
# ===================================================================

# ===================================================================
# APPLICATION
# ===================================================================
spring.application.name=Ticket Tracker
server.port=8080
server.servlet.context-path=/ticket-tracker

# ===================================================================
# DATABASE - ORACLE CONNECTION
# ===================================================================
# IMPORTANT: Update these values for your Oracle database

# Oracle JDBC URL format: jdbc:oracle:thin:@hostname:port:SID
# or for service name: jdbc:oracle:thin:@hostname:port/SERVICE_NAME
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:ORCL
spring.datasource.username=ticket_tracker_user
spring.datasource.password=your_password_here
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.pool-name=TicketTrackerHikariPool

# ===================================================================
# JPA / HIBERNATE
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Hibernate Additional Properties
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# ===================================================================
# LOGGING
# ===================================================================
logging.level.root=INFO
logging.level.com.tickettracker=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Log file configuration
logging.file.name=logs/ticket-tracker.log
logging.file.max-size=10MB
logging.file.max-history=30

# ===================================================================
# SECURITY
# ===================================================================
# Session timeout (in seconds) - 30 minutes
server.servlet.session.timeout=1800s
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.name=TICKET_TRACKER_SESSION

# ===================================================================
# FILE UPLOAD
# ===================================================================
# Maximum file size for uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# File storage location (filesystem path)
file.storage.location=/var/ticket-tracker/uploads
# Alternative for Windows: file.storage.location=C:/ticket-tracker/uploads

# ===================================================================
# ERROR HANDLING
# ===================================================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# ===================================================================
# CORS CONFIGURATION
# ===================================================================
# Allowed origins (comma-separated)
cors.allowed-origins=http://localhost:3000,http://localhost:8080
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# ===================================================================
# ACTUATOR (Optional - for monitoring)
# ===================================================================
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ===================================================================
# APPLICATION SPECIFIC PROPERTIES
# ===================================================================
app.name=Ticket Tracker
app.version=1.0.0
app.description=Enterprise Ticket Management System

# Password encoding strength (BCrypt)
app.security.password-strength=10

# JWT (if implementing token-based auth in future)
# app.security.jwt.secret=your-secret-key-here
# app.security.jwt.expiration=86400000

# ===================================================================
# DEVELOPMENT PROFILE OVERRIDES
# ===================================================================
# Uncomment to enable H2 console for development
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console
