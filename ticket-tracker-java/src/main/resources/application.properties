# Application Configuration

# Application Metadata
app.name=Ticket Tracker
app.version=1.0.0
app.description=Comprehensive ticket tracking and workflow management system

# File Upload Configuration
upload.directory=/opt/ticket-tracker/uploads
upload.max.size=10485760
upload.allowed.extensions=pdf,doc,docx,txt,jpg,jpeg,png,gif,xlsx,xls,zip

# Session Configuration
session.timeout=1800

# Security Configuration
security.password.salt.rounds=10
security.csrf.enabled=true
security.failed.login.attempts=5
security.account.lockout.duration=900

# Pagination
pagination.default.page.size=20
pagination.max.page.size=100

# Audit Log Retention (days)
audit.log.retention.days=365

# Environment
environment=development
