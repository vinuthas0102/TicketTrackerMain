version: '3.8'

services:
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ticket-tracker-frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8080/api}
      - VITE_API_TIMEOUT=${VITE_API_TIMEOUT:-30000}
      - VITE_ENABLE_LOGGING=${VITE_ENABLE_LOGGING:-false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ticket-tracker-network

networks:
  ticket-tracker-network:
    driver: bridge
